# Refreshes mod data from the Factorio Mod Portal and deploys the site to GitHub Pages.
# Repo settings → Pages → Source must be set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # hourly, picks up new mods, releases and download counts
  workflow_dispatch:

permissions:
  contents: write # commits data/history.json back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # If the portal is down, deploy with the committed data/mods.js.
      - run: python scripts/fetch_mods.py || echo "::warning::Mod Portal fetch failed, using committed data"
      # history.json only changes on the first run of a day, so this commits once a day.
      # The daily commit also keeps GitHub from pausing the schedule after 60 idle days.
      - name: Save download history
        run: |
          [ -z "$(git status --porcelain data/history.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Update download history"
          git pull --rebase -q && git push -q || echo "::warning::Could not push history; the next run retries"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
